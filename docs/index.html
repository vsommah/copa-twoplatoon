<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copa TwoPlatoon</title>
<meta name="description" content="Confrontos, chaveamento e placares da Copa TwoPlatoon (Séries A a E).">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1b2420; --muted:#69736d; --line:#e1dccf;
  --turf:#1f6f43; --turf-ink:#fff; --win:#e4f1e8; --live:#d9480f;
  --A:#b7791f; --B:#2b6cb0; --C:#c05621; --D:#6b46c1; --E:#2f855a;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 18px -8px rgba(20,30,25,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --card:#161e1a; --ink:#ecefe9; --muted:#97a39b; --line:#26322c;
    --turf:#3fae72; --turf-ink:#06140c; --win:#1b3427; --live:#ff8a4c;
    --A:#e0a93f; --B:#63a4ee; --C:#ee8a54; --D:#a98bef; --E:#52c28a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --card:#161e1a; --ink:#ecefe9; --muted:#97a39b; --line:#26322c;
  --turf:#3fae72; --turf-ink:#06140c; --win:#1b3427; --live:#ff8a4c;
  --A:#e0a93f; --B:#63a4ee; --C:#ee8a54; --D:#a98bef; --E:#52c28a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 64px}
h1,h2,h3,.num{font-family:"Barlow Condensed",sans-serif;letter-spacing:.01em}
header{padding:28px 0 8px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:clamp(34px,7vw,56px);line-height:.95;font-weight:800;text-transform:uppercase}
h1 span{color:var(--turf)}
.meta{color:var(--muted);font-size:14px;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;color:var(--ink)}
.chip.live{color:var(--live);border-color:currentColor}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:15px;cursor:pointer}
.champ{margin:18px 0 0;background:var(--turf);color:var(--turf-ink);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.champ small{display:block;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-size:12px}
.champ b{font:800 34px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 6px;align-items:center}
.search{flex:1 1 240px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit}
.search:focus,.tab:focus-visible,.pill:focus-visible,.theme:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:14px;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:700 19px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--turf)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px "Barlow",sans-serif;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.pill small{opacity:.7;font-weight:500;margin-left:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));margin-top:14px}
.m{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.m.dim{opacity:.35}
.m.hit{outline:2px solid var(--turf)}
.mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:8px 12px 0;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px 68px;align-items:center;gap:2px;padding:8px 12px}
.row+.row{border-top:1px dashed var(--line)}
.row.head{padding:4px 12px 0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.row.head span:not(:first-child){text-align:right}
.row.w{background:var(--win)}
.team{display:flex;gap:8px;align-items:center;min-width:0}
.team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row.w .nm{font-weight:700}
.team .tbd{color:var(--muted);font-style:italic}
.b{flex:none;display:inline-grid;place-items:center;min-width:34px;height:20px;border-radius:5px;font:700 12px "Barlow Condensed",sans-serif;color:#fff;letter-spacing:.03em}
.b.A{background:var(--A)}.b.B{background:var(--B)}.b.C{background:var(--C)}.b.D{background:var(--D)}.b.E{background:var(--E)}
.sc{text-align:right;font:600 17px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;color:var(--muted)}
.sc.t{color:var(--ink);font-weight:800;font-size:20px}
.sc.liveleg{color:var(--live)}
.tie{font-size:11px;color:var(--muted);padding:0 12px 8px}
.stack{display:grid;gap:18px;margin-top:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:12px 14px;font-size:22px;text-transform:uppercase;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap}
th{font:600 11px "Barlow",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%;min-width:130px;white-space:normal;word-break:break-word}
th:first-child,td:first-child{text-align:center;width:36px}
tr+tr td{border-top:1px solid var(--line)}
tr.hit td{background:var(--win)}
tr.dim{opacity:.35}
.tscroll{overflow-x:auto}
.st{font-size:12px;color:var(--muted)}
.st.ok{color:var(--turf);font-weight:600}
.bracket{display:flex;gap:18px;overflow-x:auto;padding:16px 2px 8px;align-items:stretch}
.col{flex:0 0 240px;display:flex;flex-direction:column;gap:10px}
.colbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.col h4{margin:0 0 4px;font:700 18px "Barlow Condensed",sans-serif;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;position:sticky;left:0}
.bm{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.bm .row{grid-template-columns:minmax(0,1fr) 62px;padding:6px 10px}
.bm.hit{outline:2px solid var(--turf)}.bm.dim{opacity:.35}
.rules{max-width:720px}
.rules li{margin:6px 0}
.rules code{background:var(--win);border-radius:4px;padding:1px 5px}
.empty,.err{color:var(--muted);padding:32px 0;text-align:center}
footer{color:var(--muted);font-size:13px;margin-top:40px;text-align:center}
@media (max-width:420px){.row{grid-template-columns:minmax(0,1fr) 48px 48px 62px}.sc.t{font-size:19px}.sc{font-size:16px}th,td{padding:8px 6px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div>
      <h1>Copa <span>TwoPlatoon</span></h1>
      <div class="meta" id="meta"></div>
    </div>
    <button class="theme" id="theme" aria-label="Alternar tema claro/escuro" title="Tema">Tema</button>
  </div>
  <div id="champ"></div>
</header>

<div class="tools">
  <input class="search" id="q" type="search" placeholder="Procure seu time ou seu usuário…" aria-label="Buscar time">
</div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main id="view"><p class="empty">Carregando…</p></main>
<footer>Placares puxados da Sleeper automaticamente · desempate no agregado: maior PF nas semanas 1–5</footer>
</div>

<script>
const TABS=[["jogos","Confrontos"],["chave","Chaveamento"],["tabela","Classificação"],["toilet","Toilet Bowl 💩"],["regras","Regras"]];
let D=null, tab="jogos", round=null, q="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"–":n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

// tema
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#theme").onclick=()=>{const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  const cur=document.documentElement.dataset.theme||(dark?"dark":"light");
  const next=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=next;
  try{localStorage.setItem("theme",next)}catch(e){}};

fetch("data/cup.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;init()})
 .catch(()=>{$("#view").innerHTML='<p class="err">Ainda não há dados publicados. Rode <code>python copa.py update</code>.</p>'});

function curRound(){
  const rs=D.rounds; let idx=0;
  rs.forEach((r,i)=>{ if(r.weeks[0]<=D.nfl_week) idx=i; });
  return rs[idx].key;
}
function init(){
  const when=new Date(D.generated_at).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
  const live=D.nfl_week>=6&&D.nfl_week<=17;
  $("#meta").innerHTML=`<span class="chip ${live?"live":""}">${live?'<i class="dot"></i>':""}Semana ${D.nfl_week}</span><span>Atualizado em ${esc(when)}</span>`;
  if(D.champion){const t=D.teams[D.champion];
    $("#champ").innerHTML=`<div class="champ"><small>🏆 Campeão ${D.season}</small><b>${esc(t.name)}</b> <span class="st" style="color:inherit;opacity:.85">· Série ${t.series}</span></div>`;}
  if(D.warnings&&D.warnings.length)$("#champ").insertAdjacentHTML("beforeend",`<p class="st" style="margin:12px 0 0">⚠️ ${D.warnings.map(esc).join("<br>")}</p>`);
  round=curRound(); if(D.nfl_week<6) tab="tabela";
  $("#tabs").innerHTML=TABS.map(([k,n])=>`<button class="tab" role="tab" data-k="${k}">${n}</button>`).join("");
  $("#tabs").onclick=e=>{const k=e.target.dataset?.k;if(k){tab=k;render()}};
  $("#q").oninput=e=>{q=norm(e.target.value.trim());render()};
  render();
}
const badge=t=>`<span class="b ${t.series}" title="Série ${t.series}">${esc(t.label)}</span>`;
const match=t=>!q||norm(t.name+" "+t.owner).includes(q);
const hitM=m=>q&&((m.a&&match(m.a))||(m.b&&match(m.b)));

function teamRow(m,side,single){
  const t=m[side], other=side==="a"?"b":"a";
  const win=m.winner&&t&&m.winner===t.id;
  const who=t?`<span class="team">${badge(t)}<span class="nm">${esc(t.name)}</span></span>`
             :`<span class="team"><span class="tbd">${esc(m["tbd_"+side]||"A definir")}</span></span>`;
  const legs=m.legs.map(l=>`<span class="sc ${l.state==="live"?"liveleg":""}">${fmt(l[side])}</span>`).join("");
  const pad=m.legs.length===1?'<span class="sc"></span>':"";
  const tot=`<span class="sc t">${fmt(m["total_"+side])}</span>`;
  return `<div class="row ${win?"w":""}">${who}${pad}${legs}${tot}</div>`;
}
function matchCard(m){
  const heads=m.legs.map(l=>`<span>S${l.week}</span>`).join("");
  const pad=m.legs.length===1?"<span></span>":"";
  const dim=q&&!hitM(m)?"dim":"", hit=hitM(m)?"hit":"";
  const live=m.legs.some(l=>l.state==="live");
  return `<article class="m ${dim} ${hit}">
    <div class="mh"><span>${esc(m.id)}</span>${live?'<span style="color:var(--live)">● ao vivo</span>':""}</div>
    <div class="row head"><span></span>${pad}${heads}<span>Total</span></div>
    ${teamRow(m,"a")}${teamRow(m,"b")}
    ${m.tiebreak?'<div class="tie">Empate no agregado — decidido pelo PF das semanas 1–5.</div>':""}
  </article>`;
}

function viewJogos(){
  const r=D.rounds.find(x=>x.key===round);
  const pills=D.rounds.map(x=>`<button class="pill" aria-pressed="${x.key===round}" data-r="${x.key}">${esc(x.name)}<small>S${x.weeks.join("–")}</small></button>`).join("");
  let body=r.matches.map(matchCard).join("");
  let note="";
  if(r.key==="f2"&&!D.draw) note='<p class="empty" style="padding:12px 0">O sorteio da Fase 2 acontece assim que a Fase 1 terminar. A1 a A4 já estão garantidos.</p>';
  if(r.key==="f2"&&D.draw) note=`<p class="st" style="margin:12px 0 0">Sorteio feito com a semente pública <code>${esc(D.draw.seed)}</code> (soma dos PF da Fase 1).</p>`;
  return `<div class="pills" id="pills">${pills}</div>${note}<div class="grid">${body}</div>`;
}

function viewChave(){
  const cols=D.rounds.slice(2).map(r=>{
    const ms=r.matches.map(m=>{
      const rows=["a","b"].map(s=>{const t=m[s],w=m.winner&&t&&m.winner===t.id;
        return `<div class="row ${w?"w":""}"><span class="team">${t?badge(t)+`<span class="nm">${esc(t.name)}</span>`:`<span class="tbd">${esc(m["tbd_"+s]||"A definir")}</span>`}</span><span class="sc t">${fmt(m["total_"+s])}</span></div>`}).join("");
      return `<div class="bm ${q&&!hitM(m)?"dim":""} ${hitM(m)?"hit":""}">${rows}</div>`}).join("");
    return `<div class="col"><h4>${esc(r.name)}</h4><div class="colbody">${ms}</div></div>`}).join("");
  return `<div class="bracket">${cols}</div><p class="st">Totais = soma dos PF dos jogos de ida e volta. As Fases 1 e 2 estão na aba Confrontos.</p>`;
}

function viewTabela(){
  const out=Object.keys(D.standings).map(s=>{
    const rows=D.standings[s].map(r=>{
      const t=D.teams[s+r.seed]; const direct=s==="A"&&r.seed<=4;
      let st;
      if(!D.seeds_frozen) st=direct?'<span class="st ok">Direto Fase 2</span>':'<span class="st">Fase 1</span>';
      else if(D.champion===t.id) st='<span class="st ok">Campeão 🏆</span>';
      else if(D.eliminated[t.id]) st=`<span class="st">Caiu: ${esc(D.eliminated[t.id])}</span>`;
      else st='<span class="st ok">Na briga</span>';
      return `<tr class="${q&&!match(t)?"dim":""} ${q&&match(t)?"hit":""}"><td>${r.seed}</td><td>${esc(r.name)}</td><td>${t.record}</td><td>${fmt(r.pf)}</td><td>${st}</td></tr>`}).join("");
    return `<section class="panel"><h3><span class="b ${s}" style="height:26px;min-width:30px;font-size:16px">${s}</span>Série ${s}</h3>
      <div class="tscroll"><table><thead><tr><th>#</th><th>Time</th><th>V-D</th><th>PF</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}).join("");
  const aviso=D.seeds_frozen?"Seeds congelados após a Semana 5.":"Classificação provisória — os seeds são definidos ao fim da Semana 5.";
  return `<p class="st" style="margin:14px 0 0">${aviso}</p><div class="stack">${out}</div>`;
}

function viewToilet(){
  const T=D.toilet;
  if(!T.ready) return '<p class="empty">O Toilet Bowl (S16) só é definido depois das semifinais. Quem for eliminado até lá entra na lista.</p>';
  const out=Object.keys(T.series).map(s=>{
    const rows=T.series[s].teams.map((r,i)=>`<tr class="${q&&!norm(r.name).includes(q)?"dim":""}"><td>${i+1}</td><td>${esc(r.name)} ${T.series[s].loser===r.id?"💩":""}</td><td>${fmt(r.pf)}</td></tr>`).join("");
    return `<section class="panel"><h3><span class="b ${s}" style="height:26px;min-width:30px;font-size:16px">${s}</span>Série ${s}</h3>
      <div class="tscroll"><table><thead><tr><th>#</th><th>Time</th><th>PF S16</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}).join("");
  return `<p class="st" style="margin:14px 0 0">Menor PF da S16 em cada série “leva” o 💩.</p><div class="stack">${out}</div>`;
}

function viewRegras(){
  return `<div class="rules stack"><ul>
  <li><b>Semanas 1–5:</b> definem os seeds dentro de cada série (vitórias; desempate por PF).</li>
  <li><b>S6–S7 · Fase 1:</b> 56 times — Séries B, C, D e E + #5 a #12 da Série A. O 1º da lista (A5, A6… B1… E12) enfrenta o último, o 2º o penúltimo, e assim por diante.</li>
  <li><b>S8–S9 · Fase 2:</b> 28 classificados + #1 a #4 da Série A (entrada direta). Há sorteio público e reproduzível; A1–A4 caem em chaves diferentes.</li>
  <li><b>S10–S15:</b> Oitavas (S10–11), Quartas (S12–13) e Semis (S14–15).</li>
  <li><b>S16 · Toilet Bowl 💩:</b> amistoso dos eliminados; o menor PF de cada série leva o título.</li>
  <li><b>S17 · Final 🏆:</b> jogo único.</li>
  <li>Confrontos de ida e volta: vence quem somar mais PF nos dois jogos. Empate no agregado: maior PF nas semanas 1–5.</li>
  </ul></div>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===tab));
  const v={jogos:viewJogos,chave:viewChave,tabela:viewTabela,toilet:viewToilet,regras:viewRegras}[tab]();
  $("#view").innerHTML=v;
  const p=$("#pills"); if(p) p.onclick=e=>{const b=e.target.closest("[data-r]");if(b){round=b.dataset.r;render()}};
}
</script>
</body>
</html>
